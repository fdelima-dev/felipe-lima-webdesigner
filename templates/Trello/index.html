<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Clone</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="trello">
        <img src="images/trello.svg" class="logo"/>
        <img src="images/analytics.svg" alt="analytics" class="analytics" />
        <img src="images/interactive.svg" alt="interactive" class="atlasian"/>
        <div class="container">
            <form method="get">
                <h2>Fazer login Trello</h2>
                <input type="text" name="email" placeholder="Inserir e-mail..." />
                <input type="password" name="passwd" placeholder="Inserir senha..." />
                <button class="btn-login" type="submit">Fazer login</button>

                <span>ou</span>

                <button class="btn-other">
                    <img src="images/google.svg" alt="Login com Google" /> Continuar com Google 
                </button>
                <button class="btn-other">
                    <img src="images/microsoft.svg" alt="Login com Microsoft" /> Continuar com Microsoft 
                </button>
                <button class="btn-other">
                    <img src="images/teste.svg" alt="Login com Google" /> Continuar com Apple 
                </button>
                <button class="btn-other">
                    <img src="images/slack.svg" alt="Login com Google" /> Continuar com Slack 
                </button>
            </form>
        </div>
    </div>
    <div class="imagesInteractives">
        <div class="interactiveContainer">
            
            <img src="images/atlassian.svg" alt="atlassian" class="atlassian"/>
            
        </div>
    </div>
</body>
</html>
